[project]
name = "lgrep"
version = "3.2.2"
description = "Dual-engine code intelligence MCP server: semantic search (Voyage Code 3 + LanceDB) and symbol intelligence (tree-sitter AST parsing)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jeremy Rede" }
]
keywords = ["mcp", "semantic-search", "code-search", "embeddings", "lancedb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "lancedb>=0.5.0",
    "voyageai>=0.3.0",
    # Upper bound is load-bearing: mcp 2.x removed mcp.server.fastmcp, which
    # lgrep.server imports. Lift only together with the MCPServer migration.
    "mcp>=1.28,<2",
    "watchdog>=4.0.0",
    "chonkie[code]>=1.5.0,<2.0.0",
    "gitignorefile>=1.1.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "tree-sitter-language-pack>=0.13.0,<1.0.0",
    "pathspec>=0.12.0",
    "typing-extensions>=4.12.0",
]

[project.urls]
Homepage = "https://sharperflow.com/projects/lgrep"
Repository = "https://github.com/Sharper-Flow/lgrep"
Changelog = "https://github.com/Sharper-Flow/lgrep/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Pinned to a minor range: the formatter's output is version-sensitive, so an
    # unpinned constraint lets CI drift onto a newer ruff than contributors run and
    # turn `ruff format --check` red without a code change. Bump deliberately.
    "ruff>=0.16.0,<0.17.0",
    "packaging>=24.0",
]

[project.scripts]
lgrep = "lgrep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgrep"]

[tool.hatch.build.targets.wheel.force-include]
"skills/lgrep/SKILL.md" = "skills/lgrep/SKILL.md"
"instructions/lgrep-tools.md" = "instructions/lgrep-tools.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # ADV change/archive state. Owned by the Advance tooling, not project source;
    # reformatting it would rewrite recorded artifacts.
    ".adv",
    # ruff >=0.16 formats Python code blocks inside Markdown. The examples in our
    # docs are hand-wrapped for reading and for agent consumption, so leave prose
    # files alone and keep the formatter scoped to real Python source.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
